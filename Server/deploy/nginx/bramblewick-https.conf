server {
    listen 80;
    listen [::]:80;
    server_name 104-207-83-247.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt-bw; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 104-207-83-247.sslip.io;
    ssl_certificate /etc/letsencrypt/live/104-207-83-247.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/104-207-83-247.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/bramblewick-link/public;
    index index.html;

    location /mp/ {
        proxy_pass http://127.0.0.1:5090;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        client_max_body_size 4k;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5090;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        client_max_body_size 600k;
    }
    location = /health {
        proxy_pass http://127.0.0.1:5090;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        client_max_body_size 4k;
    }
    # 3D is the main site (2026-10-30). / serves /3d/index.html; root-level misses fall back to /3d/ files.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /3d/index.html =404;
    }
    location = /2d { return 301 /2d/; }
    location /2d/ {
        alias /opt/bramblewick-link/public/;
        index index.html;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /3d$uri =404;
    }
}
