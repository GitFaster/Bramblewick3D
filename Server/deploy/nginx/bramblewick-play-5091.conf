server {
    listen 5091;
    server_name _;
    root /opt/bramblewick-link/public;
    index index.html;

    location /mp/ {
        proxy_pass http://127.0.0.1:5090;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        client_max_body_size 4k;
    }
    # Bramblewick Link account API (register, login, cloud save, hiscores)
    location /api/ {
        proxy_pass http://127.0.0.1:5090;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        client_max_body_size 600k;
    }
    location = /health {
        proxy_pass http://127.0.0.1:5090;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        client_max_body_size 4k;
    }
    # 3D is the main site (2026-10-30). / serves /3d/index.html; root-level misses fall back to /3d/ files.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /3d/index.html =404;
    }
    location = /2d { return 301 /2d/; }
    location /2d/ {
        alias /opt/bramblewick-link/public/;
        index index.html;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /3d$uri =404;
    }
}
