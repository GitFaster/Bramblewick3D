<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Bramblewick 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--mm:min(26vw,26vh,112px)}
.hud{position:fixed;z-index:5;color:#ffe9a3;text-shadow:1px 1px 0 #000;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#area{left:calc(8px + var(--sl));top:calc(6px + var(--st));background:#2a2015bb;border:1px solid #5a4630;border-radius:6px;padding:3px 8px;font:800 12px system-ui,sans-serif;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mm{right:calc(6px + var(--sr));top:calc(6px + var(--st));width:var(--mm);height:var(--mm);border-radius:50%;border:2px solid #5a4630;background:#000}
#orbs{right:calc(12px + var(--mm) + var(--sr));top:calc(6px + var(--st));display:flex;flex-direction:column;gap:4px}
.orb{width:44px;height:44px;box-sizing:border-box;border-radius:50%;border:2px solid #5a4630;background:#3a1d1dcc;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 12px sans-serif;color:#fff;cursor:pointer}
.orb small{font-size:8px;color:#ffe9a3}#run.on{background:#6b5d16}
#chat{left:calc(6px + var(--sl));bottom:calc(6px + var(--sb));width:min(64vw,380px);min-height:44px;box-sizing:border-box;max-height:44px;overflow:hidden;background:#2a2015aa;border:1px solid #5a4630;border-radius:8px;padding:4px 8px;font:12px sans-serif;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}
#chat>div{display:none;line-height:16px}#chat>div:last-child{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chat.open{max-height:40vh}#chat.open>div{display:block;white-space:normal}
#chat:not(.open)::after{content:'▴';position:absolute;right:6px;top:2px;font-size:10px;color:#ffe9a3}
#invb{right:calc(6px + var(--sr));bottom:calc(6px + var(--sb));width:48px;height:48px;border-radius:10px;border:2px solid #5a4630;background:#2a2015;font-size:24px;cursor:pointer;padding:0}
#inv{right:calc(6px + var(--sr));bottom:calc(60px + var(--sb));display:none;grid-template-columns:repeat(4,44px);gap:4px;background:#2a2015ee;border:2px solid #5a4630;border-radius:8px;padding:6px}
#inv div{width:44px;height:44px;background:#0003;border-radius:4px}
@media (orientation:landscape) and (max-height:500px){:root{--mm:min(22vh,96px)}#chat{width:min(42vw,360px)}#chat.open{max-height:60vh}}
#menu{position:fixed;z-index:20;display:none;background:#5d5447;border:2px solid #1a1a1a;font:14px sans-serif;min-width:150px}
#menu .h{background:#000;color:#5d5447;padding:2px 6px;font-weight:700}#menu div.e{padding:12px 10px;min-height:20px;color:#fff;cursor:pointer}#menu div.e:hover{color:#ff0;background:#0003}
.y{color:#ff0}.c{color:#0ff}
#inv.gpan div{width:auto;height:auto;background:none;border-radius:0}
#inv.gpan{display:none;grid-template-columns:1fr;width:min(330px,calc(100vw - 20px - var(--sl) - var(--sr)));max-height:calc(100vh - 140px - var(--st) - var(--sb));overflow-y:auto;gap:4px;font:12px sans-serif;color:#ffe9a3;z-index:12}
#inv.gpan .ph{display:flex;gap:6px;align-items:center;justify-content:space-between;font-weight:700;padding:2px}#inv.gpan .ph span{color:#fff}
#inv.gpan button,#gtabs button{font:700 12px sans-serif;background:#4a3a26;color:#ffe9a3;border:1px solid #1a140c;border-radius:6px;padding:8px 8px;min-height:36px}#inv.gpan button.on{background:#7a5a2a;color:#fff}
#inv.gpan .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}#inv.gpan .bk{grid-template-columns:repeat(5,1fr)}
#inv.gpan .slot{height:46px;background:#0004;border-radius:5px;position:relative;border-left:4px solid var(--c,#0000);padding:2px 3px;box-sizing:border-box;overflow:hidden;cursor:pointer}
#inv.gpan .slot b{font-size:10px;line-height:1.1;display:block;color:#fff}#inv.gpan .slot i{position:absolute;left:4px;bottom:2px;color:#ff0;font-style:normal;font-weight:700}
#inv.gpan .eqg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}#inv.gpan .slot.eq small{color:#ffe9a3}
#inv.gpan .sk{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}#inv.gpan .sk div{background:#0004;border-radius:5px;padding:4px}#inv.gpan .sk b{display:block;color:#ffe9a3;text-transform:capitalize}#inv.gpan .sk span{font:800 16px sans-serif;color:#fff;margin-right:4px}
#inv.gpan .shop .row{display:flex;justify-content:space-between;padding:10px 6px;background:#0004;border-radius:5px;margin-bottom:3px;cursor:pointer}
#gtabs{position:fixed;right:calc(60px + var(--sr));bottom:calc(6px + var(--sb));display:flex;gap:4px;z-index:11}#gtabs button{width:48px;height:48px;font-size:20px;padding:0;border:2px solid #5a4630;background:#2a2015;border-radius:10px}
.hpb{position:absolute;left:0;top:0;width:40px;height:6px;background:#c00;border:1px solid #000}.hpb i{display:block;height:100%;background:#0c0}
.splat{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:#b00;color:#fff;font:800 14px sans-serif;display:flex;align-items:center;justify-content:center;border:2px solid #600}.splat.miss{background:#246;border-color:#123}
#chat .r{color:#f66}#menu .o{color:#ff9040}
</style></head><body>
<canvas id="c"></canvas>
<div id="area" class="hud">Bramblewick 3D</div>
<canvas id="mm" class="hud" width="280" height="280"></canvas>
<div id="orbs" class="hud"><div class="orb" id="hp"><small>HP</small><span>10</span></div><div class="orb" id="run"><small>RUN</small><span>100</span></div></div>
<div id="chat" class="hud"></div>
<button id="invb" class="hud">🎒</button><div id="inv" class="hud"></div>
<div id="menu"></div>
<div id="boot" style="position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:#000;color:#ffe9a3;font:700 16px sans-serif;white-space:pre-wrap;text-align:center;padding:20px">Loading Bramblewick 3D…</div>
